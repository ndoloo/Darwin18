<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Deriv Market Scanner</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121214; color: #fff; text-align: center; }
        .card { background: #202024; padding: 30px; border-radius: 8px; max-width: 500px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn { display: inline-block; background: #ff4444; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 16px; }
        .btn:hover { background: #cc3333; }
        #log { background: #000; color: #00ff00; padding: 15px; border-radius: 4px; height: 250px; overflow-y: auto; font-family: monospace; text-align: left; margin-top: 20px; border: 1px solid #333; white-space: pre-wrap; }
        .success-text { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Deriv OAuth 2.0 Scanner</h2>
    <p>Click below to log in securely through Deriv. Once authorized, your live market feed will start automatically.</p>
    
    <a id="loginBtn" href="#" class="btn">🔐 Log In via Deriv</a>
    
    <h3>Live WebSocket Stream:</h3>
    <div id="log">Awaiting authentication. Click the button above to begin...</div>
</div>

<script>
// Use your real Deriv numeric app ID from the Deriv dashboard.
const MY_NUMERIC_APP_ID = '12345';

// Correct Deriv OAuth URL
const loginUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${MY_NUMERIC_APP_ID}&l=en`;
document.getElementById('loginBtn').href = loginUrl;

function logMessage(msg) {
    const logDiv = document.getElementById('log');
    const line = document.createElement('div');
    line.textContent = msg;
    logDiv.appendChild(line);
    logDiv.scrollTop = logDiv.scrollHeight;
}

function getOAuthToken() {
    const urlParams = new URLSearchParams(window.location.search);
    let token = urlParams.get('token1');
    if (!token && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        token = hashParams.get('token1');
    }
    return token;
}

function initWebSocketScanner() {
    const token = getOAuthToken();

    if (!token) {
        logMessage("Awaiting authorization step. Please click 'Log In via Deriv' above.");
        return;
    }

    logMessage("Connecting to secure Deriv WebSocket server...");
    const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${MY_NUMERIC_APP_ID}`);

    ws.onopen = function() {
        logMessage("🟢 WebSocket connected! Verifying token...");
        ws.send(JSON.stringify({ authorize: token }));
    };

    ws.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);

            if (data.error) {
                logMessage(`🔴 Deriv API Error: ${data.error.message || JSON.stringify(data.error)}`);
                return;
            }

            if (data.msg_type === 'authorize') {
                logMessage("🚀 Login successful! App is fully linked.");
                logMessage("Subscribing to Volatility 100 Index (R_100) data ticks...");
                ws.send(JSON.stringify({ ticks: 'R_100' }));
                return;
            }

            if (data.tick) {
                logMessage(`📈 Tick movement [${data.tick.symbol}]: $${data.tick.quote}`);
            }
        } catch (err) {
            logMessage(`⚠️ Failed to parse message: ${err.message}`);
        }
    };

    ws.onerror = function() {
        logMessage("🔴 WebSocket connection error. Verify your App ID is active and your token is valid.");
    };

    ws.onclose = function() {
        logMessage("⚪ Connection closed.");
    };
}

window.onload = initWebSocketScanner;
</script>

</body>
</html>
